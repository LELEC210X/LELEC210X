[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "scipy",
]
description = "Telecom applications and analysis tools"
name = "telecom"
requires-python = ">= 3.9"
version = "0.1.0"

[project.scripts]
plot-cfo-histogram = "apps.plot_cfo_histogram:main"
plot-summaries     = "apps.plot_summaries:main"

[tool.hatch.build.targets.wheel]
packages = ["apps"]
